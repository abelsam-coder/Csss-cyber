<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberNova Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #6366f1;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #94a3b8;
        }

        #main {
            display: flex;
            min-height: 100vh;
            animation: fadeIn 0.8s ease-out;
        }

        .left {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: url('http://static.photos/technology/1200x630/43') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
        }

        .left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            z-index: 0;
        }

        .left h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
            animation: slideInLeft 0.8s ease-out;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .left h3 {
            font-size: 1.2rem;
            line-height: 1.6;
            color: var(--gray);
            position: relative;
            z-index: 1;
            animation: slideInLeft 1s ease-out;
            max-width: 80%;
        }

        .right {
            flex: 1;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: var(--dark);
            position: relative;
        }

        form {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            animation: fadeInUp 1s ease-out;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--gray);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--gray);
            border-radius: 0.375rem;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--light);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }

        button {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        span {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray);
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--secondary);
        }

        @media (max-width: 768px) {
            #main {
                flex-direction: column;
            }
            
            .left, .right {
                padding: 2rem;
            }
            
            .left h1 {
                font-size: 2rem;
            }
            
            .left h3 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <custom-navbar></custom-navbar>

    <main id="main">
        <div class="left">
            <h1>Login Page</h1>
            <h3>Welcome back to CyberNova. Let's dive into the cyber world with our cutting-edge security solutions.</h3>
        </div>

        <div class="right">
            <form action="">
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password" required>

                <button type="submit" class="animate__animated animate__pulse animate__infinite animate__slower">Login</button>

                <span>Don't have an account? <a href="signup.html">Sign Up</a></span>
            </form>
        </div>
    </main>

    <script src="components/navbar.js"></script>
    <script src="script.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Simple validation
            if (username && password) {
                alert('Login successful! Redirecting to dashboard...');
                // In a real app, you would handle authentication here
            } else {
                alert('Please fill in all fields');
            }
        });

        // Add input focus effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.style.transform = 'translateY(-5px)';
                input.style.boxShadow = '0 10px 20px rgba(59, 130, 246, 0.2)';
            });
            
            input.addEventListener('blur', () => {
                input.style.transform = '';
                input.style.boxShadow = '';
            });
        });
    </script>
</body>
</html>
